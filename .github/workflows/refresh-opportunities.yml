name: Refresh research opportunities

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-research-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the registry
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install watcher dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify official sources and discover new calls
        run: python scripts/refresh_opportunities.py

      - name: Commit the Monday refresh
        run: |
          if git diff --quiet -- data; then
            echo "No source changes detected."
            exit 0
          fi
          git config user.name "cyberresearch-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: Monday research radar refresh"
          git push
