name: Validate contributions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the contribution
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install portal dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate opportunity data
        run: |
          python scripts/refresh_opportunities.py --offline
          python scripts/refresh_journals.py --offline

      - name: Type-check
        run: pnpm exec tsc --noEmit --incremental false

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
